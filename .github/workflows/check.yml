name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: site/ matches src/ (rebuild and commit if this fails)
        run: python3 tools/build_site.py --check
      - name: Engine replay
        run: node test/replay.test.js > /dev/null
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: End-to-end (local build, mock StatBroadcast page)
        run: python3 test/e2e_site.py /tmp
